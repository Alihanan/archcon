[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archcon"
version = "0.5.16"
description = "A local web interface and Python toolkit for transparent gene-expression data exploration."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Your Name" }
]
keywords = [
  "archetypal-analysis",
  "contrastive-learning",
  "deep-learning",
  "bioinformatics",
  "gene-expression",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "gradio>=6.5,<7",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]


[project.optional-dependencies]
parquet = [
  "pyarrow>=16,<25",
]
training = [
  "torch>=2.4,<3",
]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/archcon"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/archcon"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/archcon/issues"

[project.scripts]
archcon = "archcon.cli:main"
archcon-evaluate-egfr = "archcon.evaluate_egfr:main"
archcon-rebuild-global-normalization = "archcon.rebuild_global_normalization:main"

[tool.hatch.build.targets.wheel]
# Wheel selection must not inherit a broad VCS ignore such as /data/.
# The Python package itself contains src/archcon/data/, which is required at runtime.
ignore-vcs = true
packages = ["src/archcon"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution small even when a multi-GB project-level data/
# directory exists beside the source tree.
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/METACENTRUM.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
